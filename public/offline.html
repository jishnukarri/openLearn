<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · openLearn</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #17130f; color: #f3efe8; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #b9b2a6; max-width: 32ch; }
    button { font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 14px; background: #534fe0; color: #fff; cursor: pointer; min-height: 44px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>openLearn needs a connection to load your lessons. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
